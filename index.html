<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#171717">
  <meta name="robots" content="noindex">
  <meta name="description" content="Darkshelter — black-and-white film and darkroom prints in Moutoullas, Cyprus. The website is under maintenance.">
  <title>Darkshelter · Under maintenance</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23171717'/%3E%3Cpath d='M15 56V32a17 17 0 0 1 34 0v24' fill='none' stroke='%23f1efe9' stroke-width='5'/%3E%3Ccircle cx='32' cy='40' r='5.5' fill='%23f2665a'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@1,6..72,300&family=Outfit:wght@500&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
    :root{--ink:#171717;--paper:#f1efe9;--muted:#b3afa8;--red:#f2665a;--glow:#5a1d1a;color-scheme:dark}
    *{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0;background:var(--ink);color:var(--paper);font-family:'Outfit',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
    main{min-height:100dvh;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);align-items:center;gap:clamp(24px,4vw,64px);padding:clamp(28px,6vw,80px);padding-bottom:max(clamp(28px,6vw,80px),env(safe-area-inset-bottom));max-width:1440px;margin:0 auto}
    .status{display:inline-flex;align-items:center;gap:10px;font:400 12px/1.5 'JetBrains Mono',ui-monospace,monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 clamp(28px,4vw,44px)}
    .status::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 0 0 #f2665a80;animation:pulse 2.4s ease-out infinite}
    @keyframes pulse{0%{box-shadow:0 0 0 0 #f2665a80}70%{box-shadow:0 0 0 10px #f2665a00}100%{box-shadow:0 0 0 0 #f2665a00}}
    h1{font:italic 300 clamp(44px,6.2vw,84px)/1.04 'Newsreader',Georgia,serif;letter-spacing:-.015em;margin:0;max-width:12ch;text-wrap:balance}
    .wordmark{font:500 clamp(30px,3vw,40px)/1 'Outfit',sans-serif;letter-spacing:-.025em;margin:clamp(36px,5vw,64px) 0 14px}
    .tagline{font:400 clamp(11px,1.15vw,14px)/1.6 'JetBrains Mono',ui-monospace,monospace;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin:0}
    .note{margin:clamp(32px,4vw,48px) 0 0;padding-top:22px;border-top:1px solid #f1efe926;max-width:46ch;font:400 16px/1.6 'Outfit',sans-serif;color:#d5d4cc}
    .note p{margin:0}
    .note p+p{margin-top:8px;color:var(--muted)}
    .mark{position:relative;display:grid;place-items:center;aspect-ratio:1;width:100%;max-width:560px;justify-self:center}
    .mark::before{content:'';position:absolute;inset:-12%;background:radial-gradient(closest-side,#5a1d1ae6 0%,#4a1b19a6 38%,#2b191859 66%,#17171700 100%);pointer-events:none}
    .mark svg{position:relative;width:42%;height:auto;overflow:visible}
    @media (max-width:820px){
      main{grid-template-columns:1fr;align-content:center;gap:8px;text-align:left}
      .mark{order:-1;max-width:240px;justify-self:start;margin:-8px 0 -12px -10%}
      .mark svg{width:46%}
    }
    @media (prefers-reduced-motion:reduce){.status::before{animation:none}}
  </style>
</head>
<body>
  <main>
    <section aria-labelledby="title">
      <p class="status" lang="en">Under maintenance</p>
      <h1 id="title">Photography doesn’t end when you press the shutter.</h1>
      <p class="wordmark">Darkshelter</p>
      <p class="tagline">Black-and-white film · Darkroom prints</p>
      <div class="note">
        <p>Our website is being updated. We’ll be back soon.</p>
        <p lang="el">Ο ιστότοπός μας ανανεώνεται. Επιστρέφουμε σύντομα.</p>
      </div>
    </section>
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 220 245" xmlns="http://www.w3.org/2000/svg">
        <path d="M10 245V110a100 100 0 0 1 200 0v135" fill="none" stroke="#f1efe9" stroke-width="20"/>
        <path d="M43.5 245V116a66.5 66.5 0 0 1 133 0v129" fill="none" stroke="#f1efe9" stroke-opacity=".55" stroke-width="3"/>
        <circle cx="110" cy="162.5" r="23" fill="#f2665a"/>
      </svg>
    </div>
  </main>
</body>
</html>
